<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin · Bingo Server</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* (same styles as before – unchanged) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
            color: #d4e6fa;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid rgba(60, 120, 170, 0.2);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h1 {
            color: #f5e7c8;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .admin-header h1 span {
            color: #f5c542;
        }
        .admin-header .status {
            color: #7ddfa0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .admin-header .status .dot.online {
            background: #7ddfa0;
            box-shadow: 0 0 10px rgba(125, 223, 160, 0.4);
        }
        .admin-header .status .dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
        .admin-card {
            background: rgba(20, 45, 70, 0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(60, 120, 170, 0.15);
        }
        .admin-card h2 {
            color: #f5e7c8;
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(60, 120, 170, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-card .count {
            color: #8ab0c8;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .transaction-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }
        .transaction-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .tx-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid #f5d76e;
            transition: all 0.3s;
        }
        .tx-item.approved {
            border-left-color: #7ddfa0;
            opacity: 0.7;
        }
        .tx-item.rejected {
            border-left-color: #ff6b6b;
            opacity: 0.7;
        }
        .tx-item .tx-info {
            flex: 1;
            min-width: 140px;
        }
        .tx-item .tx-info .user {
            font-weight: 700;
            color: #f5e7c8;
            font-size: 0.95rem;
        }
        .tx-item .tx-info .details {
            font-size: 0.7rem;
            color: #8ab0c8;
        }
        .tx-item .tx-amount {
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5c542;
            min-width: 60px;
        }
        .tx-item .tx-actions {
            display: flex;
            gap: 6px;
        }
        .tx-item .tx-actions button {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tx-item .tx-actions .approve {
            background: #2a8a4a;
            color: #f0fff0;
        }
        .tx-item .tx-actions .approve:hover:not(:disabled) {
            background: #3aaa5a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions .reject {
            background: #8a2a2a;
            color: #fff0f0;
        }
        .tx-item .tx-actions .reject:hover:not(:disabled) {
            background: #aa3a3a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .tx-item .tx-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tx-item .tx-status.pending {
            background: rgba(200, 180, 60, 0.2);
            color: #f5d76e;
        }
        .tx-item .tx-status.approved {
            background: rgba(70, 200, 120, 0.2);
            color: #7ddfa0;
        }
        .tx-item .tx-status.rejected {
            background: rgba(200, 70, 70, 0.2);
            color: #ff8a8a;
        }
        .tx-timestamp {
            font-size: 0.6rem;
            color: #4a6a8a;
            min-width: 50px;
            text-align: right;
        }

        .player-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .player-list::-webkit-scrollbar {
            width: 4px;
        }
        .player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .player-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .player-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-item .p-name {
            font-weight: 700;
            color: #f5e7c8;
        }
        .player-item .p-wallets {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
        }
        .player-item .p-wallets span {
            color: #8ab0c8;
        }
        .player-item .p-wallets .main {
            color: #f5c542;
        }
        .player-item .p-wallets .play {
            color: #7ddfa0;
        }
        .player-item .p-wallets .pending {
            color: #f5d76e;
        }

        .empty-state {
            color: #4a6a8a;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .refresh-btn {
            background: rgba(40, 80, 120, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.2);
            border-radius: 30px;
            padding: 6px 16px;
            color: #8ab0c8;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(40, 80, 120, 0.5);
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 26, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 197, 66, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            color: #d4e6fa;
            font-size: 0.85rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            display: none;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #7ddfa0;
        }
        .toast.error {
            border-color: #ff6b6b;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎯 <span>BINGO</span> · Admin</h1>
            <div class="status">
                <span class="dot online" id="statusDot"></span>
                <span id="adminStatus">🟢 Online</span>
                <button class="refresh-btn" id="refreshBtn">⟳ Refresh</button>
            </div>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <h2>📋 Transactions <span class="count" id="txCount">(0)</span></h2>
                <div class="transaction-list" id="transactionList"><div class="empty-state">No transactions</div></div>
            </div>
            <div class="admin-card">
                <h2>👥 Players <span class="count" id="playerCount">(0)</span></h2>
                <div class="player-list" id="playerList"><div class="empty-state">No players registered</div></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG – solve-527f4
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCdkbagIXjA17AZnbLFNgRT2_mamTJaLUw",
            authDomain: "solve-527f4.firebaseapp.com",
            databaseURL: "https://solve-527f4-default-rtdb.firebaseio.com",
            projectId: "solve-527f4",
            storageBucket: "solve-527f4.firebasestorage.app",
            messagingSenderId: "902625825327",
            appId: "1:902625825327:web:2425068977702d6f90ecda"
        };

        let database = null;
        let toastTimeout = null;

        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('✅ Firebase connected (solve-527f4)');
            document.getElementById('adminStatus').textContent = '🟢 Online';
            document.getElementById('statusDot').className = 'dot online';
        } catch (e) {
            console.warn('⚠️ Firebase error:', e);
            document.getElementById('adminStatus').textContent = '🔴 Offline';
            document.getElementById('statusDot').className = 'dot offline';
        }

        // ============================================================
        //  TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        //  LOAD DATA
        // ============================================================
        function loadTransactions() {
            if (!database) return;
            const txRef = database.ref('transactions');
            txRef.orderByChild('timestamp').limitToLast(50).on('value', snapshot => {
                const data = snapshot.val();
                const list = document.getElementById('transactionList');
                const count = document.getElementById('txCount');
                if (!data) {
                    list.innerHTML = '<div class="empty-state">No transactions</div>';
                    count.textContent = '(0)';
                    return;
                }
                const entries = Object.values(data).reverse();
                const pendingCount = entries.filter(tx => tx.status === 'pending').length;
                count.textContent = `(${entries.length} · ${pendingCount} pending)`;
                let html = '';
                entries.forEach(tx => {
                    const statusClass = tx.status || 'pending';
                    const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                    const isPending = statusClass === 'pending';
                    const timestamp = tx.timestamp ? new Date(tx.timestamp).toLocaleString() : '';
                    html += `
                        <div class="tx-item ${statusClass}">
                            <div class="tx-info">
                                <div class="user">${tx.username || 'Unknown'}</div>
                                <div class="details">${tx.type || 'Transaction'} · ${tx.amount || 0} Birr</div>
                            </div>
                            <span class="tx-status ${statusClass}">${statusLabel}</span>
                            <div class="tx-actions">
                                <button class="approve" ${!isPending ? 'disabled' : ''} data-txid="${tx.id}" onclick="approveTransaction('${tx.id}')">✅ Approve</button>
                                <button class="reject" ${!isPending ? 'disabled' : ''} data-txid="${tx.id}" onclick="rejectTransaction('${tx.id}')">❌ Reject</button>
                            </div>
                            <div class="tx-timestamp">${timestamp}</div>
                        </div>
                    `;
                });
                list.innerHTML = html || '<div class="empty-state">No transactions</div>';
            });
        }

        function loadPlayers() {
            if (!database) return;
            const usersRef = database.ref('users');
            usersRef.on('value', snapshot => {
                const data = snapshot.val();
                const list = document.getElementById('playerList');
                const count = document.getElementById('playerCount');
                if (!data) {
                    list.innerHTML = '<div class="empty-state">No players registered</div>';
                    count.textContent = '(0)';
                    return;
                }
                const entries = Object.entries(data);
                count.textContent = `(${entries.length})`;
                let html = '';
                entries.forEach(([username, userData]) => {
                    const main = userData.mainWallet || 0;
                    const play = userData.playWallet || 0;
                    const pending = userData.pendingWithdrawal || 0;
                    html += `
                        <div class="player-item">
                            <span class="p-name">${username}</span>
                            <div class="p-wallets">
                                <span class="main">💰 ${main}</span>
                                <span class="play">🎰 ${play}</span>
                                ${pending > 0 ? `<span class="pending">⏳ ${pending}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html || '<div class="empty-state">No players</div>';
            });
        }

        // ============================================================
        //  CORE FUNCTION: Find user by case‑insensitive match
        // ============================================================
        function findUserByUsername(txUsername, callback) {
            const trimmed = txUsername.trim();
            if (!trimmed) return callback(null, null);

            // Try direct match first
            const userRef = database.ref('users/' + trimmed);
            userRef.once('value', snapshot => {
                if (snapshot.exists()) {
                    return callback(trimmed, snapshot.val());
                }

                // Not found – search all users
                const allUsersRef = database.ref('users');
                allUsersRef.once('value', allSnapshot => {
                    const allUsers = allSnapshot.val();
                    if (!allUsers) return callback(null, null);

                    const keys = Object.keys(allUsers);
                    const lower = trimmed.toLowerCase();

                    // Exact case‑insensitive match
                    const exactMatch = keys.find(k => k.toLowerCase() === lower);
                    if (exactMatch) {
                        return callback(exactMatch, allUsers[exactMatch]);
                    }

                    // Try trimming spaces
                    const trimmedMatch = keys.find(k => k.toLowerCase().trim() === lower.trim());
                    if (trimmedMatch) {
                        return callback(trimmedMatch, allUsers[trimmedMatch]);
                    }

                    // No match
                    return callback(null, null);
                });
            });
        }

        // ============================================================
        //  APPROVE TRANSACTION – Auto‑sync username
        // ============================================================
        function approveTransaction(txId) {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }

            const btn = document.querySelector(`button[data-txid="${txId}"].approve`);
            if (btn) btn.disabled = true;

            const txRef = database.ref('transactions/' + txId);
            txRef.once('value', txSnapshot => {
                const txData = txSnapshot.val();
                if (!txData) {
                    showToast('Transaction not found', 'error');
                    if (btn) btn.disabled = false;
                    return;
                }
                if (txData.status !== 'pending') {
                    showToast('Transaction already processed', 'error');
                    if (btn) btn.disabled = false;
                    return;
                }

                const txUsername = (txData.username || '').trim();
                if (!txUsername) {
                    showToast('Transaction has no username', 'error');
                    if (btn) btn.disabled = false;
                    return;
                }

                const amount = parseInt(txData.amount);
                const type = txData.type;

                // Find the correct username (case‑insensitive)
                findUserByUsername(txUsername, (foundUsername, userData) => {
                    if (!foundUsername || !userData) {
                        showToast(`❌ User "${txUsername}" not found. Please create the user first.`, 'error');
                        if (btn) btn.disabled = false;
                        return;
                    }

                    // If the username differs in case, update the transaction
                    if (foundUsername !== txUsername) {
                        txRef.update({ username: foundUsername })
                            .then(() => {
                                console.log(`✅ Transaction username updated from "${txUsername}" to "${foundUsername}"`);
                                // Proceed with approval using the found username
                                processApproval(foundUsername, userData, type, amount, txRef, btn);
                            })
                            .catch(err => {
                                console.error('Failed to update transaction username:', err);
                                // Still try to process with found username
                                processApproval(foundUsername, userData, type, amount, txRef, btn);
                            });
                    } else {
                        processApproval(foundUsername, userData, type, amount, txRef, btn);
                    }
                });
            });
        }

        function processApproval(username, userData, type, amount, txRef, btn) {
            const userRef = database.ref('users/' + username);
            userRef.transaction(current => {
                if (current === null) return undefined;
                let updated = { ...current };
                if (type === 'deposit') {
                    updated.playWallet = (updated.playWallet || 0) + amount;
                } else if (type === 'withdraw') {
                    updated.mainWallet = Math.max(0, (updated.mainWallet || 0) - amount);
                    updated.pendingWithdrawal = Math.max(0, (updated.pendingWithdrawal || 0) - amount);
                } else {
                    return undefined;
                }
                return updated;
            }, (error, committed) => {
                if (error) {
                    console.error('Transaction error:', error);
                    showToast('Error updating wallet: ' + error.message, 'error');
                    if (btn) btn.disabled = false;
                    return;
                }
                if (!committed) {
                    showToast('Failed to update user wallet', 'error');
                    if (btn) btn.disabled = false;
                    return;
                }

                txRef.update({ status: 'approved' })
                    .then(() => {
                        showToast(`✅ ${username} - ${type} of ${amount} Birr approved!`, 'success');
                        loadTransactions();
                        loadPlayers();
                    })
                    .catch(err => {
                        console.error('Failed to update transaction status:', err);
                        showToast('Wallet updated, but failed to mark transaction as approved.', 'error');
                        loadTransactions();
                        loadPlayers();
                    });
            });
        }

        function rejectTransaction(txId) {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }

            const btn = document.querySelector(`button[data-txid="${txId}"].reject`);
            if (btn) btn.disabled = true;

            const txRef = database.ref('transactions/' + txId);
            txRef.update({ status: 'rejected' })
                .then(() => {
                    showToast('❌ Transaction rejected', 'error');
                    loadTransactions();
                    loadPlayers();
                })
                .catch(err => {
                    console.error('Failed to reject:', err);
                    showToast('Failed to reject transaction', 'error');
                    if (btn) btn.disabled = false;
                });
        }

        // ============================================================
        //  REFRESH
        // ============================================================
        document.getElementById('refreshBtn').onclick = () => {
            if (database) {
                database.ref('transactions').off();
                database.ref('users').off();
                loadTransactions();
                loadPlayers();
                document.getElementById('adminStatus').textContent = '🔄 Refreshing...';
                setTimeout(() => {
                    document.getElementById('adminStatus').textContent = '🟢 Online';
                    document.getElementById('statusDot').className = 'dot online';
                    showToast('✅ Refreshed successfully', 'success');
                }, 500);
            }
        };

        // ============================================================
        //  INIT
        // ============================================================
        if (database) {
            loadTransactions();
            loadPlayers();
            console.log('✅ Admin server started (solve-527f4)');
            console.log('ℹ️ Usernames will be auto‑synchronized on approval.');
        } else {
            document.getElementById('adminStatus').textContent = '🔴 Offline - Check Firebase config';
            document.getElementById('statusDot').className = 'dot offline';
        }
    </script>
</body>
</html>
